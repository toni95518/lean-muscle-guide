<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="薄肌理论指南">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Daily tracker for food, macros, exercise, water and weight.">
<meta name="theme-color" content="#F2F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1411" media="(prefers-color-scheme: dark)">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>薄肌理论指南 · Lean Muscle Theory Guide</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2710%27 cy=%2716%27 r=%277%27 fill=%27%230B7A55%27/%3E%3Ccircle cx=%2724%27 cy=%2716%27 r=%275%27 fill=%27%23C94F08%27/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — sticky header, scrolling day view, fixed tab bar, bottom sheet for logging */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --sunk:#E7ECE7; --ink:#14201B; --muted:#5A6962; --line:#D6DFD8;
  --accent:#0B7A55; --on-accent:#FFFFFF; --accent-soft:#DCEFE5;
  --burn:#C94F08; --burn-soft:#FBE7DA; --prot:#C2255C; --carb:#B87708; --fat:#5F45BF; --water:#1864AB; --water-soft:#DCEBFA;
  --danger:#B42318; --shadow:0 1px 2px rgba(20,32,27,.06),0 8px 24px rgba(20,32,27,.06);
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --tabbar:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1411; --surface:#16201B; --sunk:#1D2923; --ink:#E6EFEA; --muted:#94A49C; --line:#27352E;
  --accent:#3CC48E; --on-accent:#06150F; --accent-soft:#163A2B;
  --burn:#FF8B47; --burn-soft:#3A2416; --prot:#F06595; --carb:#F2B53A; --fat:#A08CF2; --water:#5AAEF5; --water-soft:#14304A;
  --danger:#FF7A70; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#16201B; --sunk:#1D2923; --ink:#E6EFEA; --muted:#94A49C; --line:#27352E;
  --accent:#3CC48E; --on-accent:#06150F; --accent-soft:#163A2B;
  --burn:#FF8B47; --burn-soft:#3A2416; --prot:#F06595; --carb:#F2B53A; --fat:#A08CF2; --water:#5AAEF5; --water-soft:#14304A;
  --danger:#FF7A70; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:8px;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:lang(zh) .brand{letter-spacing:.08em}
:lang(en) .top .brand{font-size:18px;letter-spacing:.03em}
@media (max-width:400px){:lang(en) .top .brand{font-size:16.5px}.top .sync span{display:none}}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:14px 0 0 var(--burn)}
.brand span{margin-left:14px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.sync b{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on b{background:var(--accent)}
.sync.saving b{background:var(--carb)}
.sync.error b{background:var(--danger)}
.sync.error{color:var(--danger)}

/* auth + loading */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:32px}
.auth .box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
.auth .brand{font-size:30px}
.auth h1{margin:0;font-family:var(--display);font-weight:700;font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.auth p.lede{margin:0;color:var(--muted);font-size:15px}
.err{margin:0;color:var(--danger);font-size:14px}
.loading{padding-block:64px;text-align:center;color:var(--muted)}
.minis{display:inline-flex;background:var(--sunk);border-radius:9px;padding:2px;gap:2px}
.minis button{border:0;background:transparent;border-radius:7px;padding:3px 9px;font-weight:600;font-size:12.5px;color:var(--muted)}
.minis button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.account{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.account .who{min-width:0;overflow-wrap:anywhere}

main{padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 84px)}
.view{display:flex;flex-direction:column;gap:14px;padding-block:14px}

/* date nav */
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav h1{margin:0;font-family:var(--display);font-weight:700;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.datenav p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn:disabled{opacity:.35;cursor:default}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
.banner button{flex:none}

/* summary */
.summary{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-family:var(--display);font-weight:700;font-size:38px;line-height:.95;font-variant-numeric:tabular-nums}
.ring .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ring.over .big{color:var(--danger)}
.eq{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px;align-items:baseline}
.eq dt{color:var(--muted)}
.eq dd{margin:0;text-align:right;font-family:var(--display);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums}
.eq .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:2px 0}
.eq .burn{color:var(--burn)}

/* macros */
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.macro .name{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.macro .val{font-family:var(--display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.macro .val small{font-size:13px;color:var(--muted);font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;border-radius:3px}

/* sections */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec-h h2{margin:0;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.sec-h .tot{font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;color:var(--muted)}
.items{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .txt{flex:1;min-width:0}
.item .n{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:12.5px;color:var(--muted)}
.item .k{font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .k.burn{color:var(--burn)}
.del{width:32px;height:32px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.del:hover{background:var(--sunk)}
.del svg{width:14px;height:14px}
.empty{font-size:13.5px;color:var(--muted);padding:2px 0 4px}
.addrow{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--accent)}
.chip.solid{border-style:solid;background:var(--sunk);color:var(--ink);font-weight:500}

/* water */
.glasses{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:8px}
.glass{aspect-ratio:3/4;max-width:100%;border:1.5px solid var(--water);border-radius:6px 6px 10px 10px;background:transparent;position:relative;overflow:hidden;padding:0}
.glass.full{background:linear-gradient(to top,var(--water) 0 78%,transparent 78%)}
.glass span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--water)}
.glass.full span{color:var(--water-soft)}

/* weight */
.wrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
input[type=text],input[type=password],input[type=number],input[type=search],select{font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.unit{position:relative}
.unit input{padding-right:42px}
.unit em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:14px;pointer-events:none}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--on-accent);font-size:15px}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.block{width:100%;padding:14px}
.btn:disabled{opacity:.45;cursor:default}

/* tab bar + fab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabbar)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:24;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 14px);border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;padding:14px 20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.fab svg{width:18px;height:18px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(8,14,11,.45)}
.panel{position:relative;background:var(--surface);border-radius:20px 20px 0 0;max-height:90%;display:flex;flex-direction:column;width:100%;max-width:600px;margin:0 auto;box-shadow:var(--shadow);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.panel-b{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.full{display:grid;grid-template-columns:repeat(var(--n,4),1fr)}
.results{list-style:none;margin:0;padding:0}
.results li button{width:100%;text-align:left;border:0;background:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 2px;border-top:1px solid var(--line)}
.results li:first-child button{border-top:0}
.results .n{font-weight:600}
.results .s{font-size:12.5px;color:var(--muted)}
.results .k{font-family:var(--display);font-weight:600;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.grouph{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:4px 0 0}
.detail h3{margin:0;font-size:20px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:600}
.stepper output{font-family:var(--display);font-weight:700;font-size:28px;min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
.facts{border:2px solid var(--ink);border-radius:10px;padding:10px 12px}
.facts .row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-top:1px solid var(--line);font-size:14px}
.facts .row:first-child{border-top:0}
.facts .cal{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.facts .hd{border-bottom:6px solid var(--ink);padding-bottom:6px;margin-bottom:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* trends */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;font-weight:500;color:var(--muted)}
.stat .l{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* goals */
.targets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form{display:flex;flex-direction:column;gap:14px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tool{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tool b{font-size:14.5px}
.tool span{font-size:12px;color:var(--muted)}
.tool.ai{border-color:var(--accent);background:var(--accent-soft)}
.tool.single{grid-column:1/-1}
textarea{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);width:100%;min-width:0;resize:vertical;color:inherit}
textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea[readonly]{font-size:13px;color:var(--muted);line-height:1.4}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.big-kcal input{font-family:var(--display);font-size:30px;font-weight:700;padding:8px 56px 8px 12px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px;background:var(--sunk);color:var(--muted)}
.tag.ai{background:var(--accent-soft);color:var(--accent)}
.ai-item{display:grid;grid-template-columns:minmax(0,1fr) 108px 32px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ai-item:first-child{border-top:0}
.ai-item input[type=text]{font-weight:600}
.ai-item .s{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:-4px}
.ai-total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:8px;font-weight:600}
.ai-total .num{font-size:24px;font-weight:700}

.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 80px);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:700;padding:4px 6px}
@media (max-width:370px){.summary{grid-template-columns:1fr;justify-items:center}.eq{width:100%}}
</style>
</head>
<body>
<section class="auth wrap" id="auth" hidden>
  <div class="box">
    <div class="brand"><i></i><span class="app-name">薄肌理论指南</span></div>
    <h1 id="auth-title">Track what you eat and how you move</h1>
    <p class="lede">Your log is saved to your account, so it's there on every device.</p>
    <form class="form" data-form="auth" novalidate>
      <div class="field" id="auth-name-f" hidden><label for="a-name">Name</label><input id="a-name" type="text" autocomplete="name" maxlength="60" placeholder="Optional"></div>
      <div class="field"><label for="a-email">Email</label><input id="a-email" type="text" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" required></div>
      <div class="field"><label for="a-pass">Password</label><input id="a-pass" type="password" autocomplete="current-password" minlength="8" required><p class="hint" id="a-pass-hint" hidden>At least 8 characters.</p></div>
      <p class="err" id="auth-err" role="alert" hidden></p>
      <button class="btn block" type="submit" id="auth-submit">Sign in</button>
    </form>
    <p class="hint" style="text-align:center"><span id="auth-switch-q">New here?</span> <button class="linkbtn" data-act="auth-mode" id="auth-switch">Create an account</button></p>
  </div>
</section>
<div class="loading" id="loading">Loading your log…</div>

<div id="app" hidden>
<header class="top"><div class="wrap">
  <div class="brand"><i></i><span class="app-name">薄肌理论指南</span></div>
  <div class="sync" id="sync"><b></b><span>Connecting…</span></div>
</div></header>

<main>
  <div class="wrap">
    <section class="view" id="view-today"></section>
    <section class="view" id="view-trends" hidden></section>
    <section class="view" id="view-goals" hidden></section>
  </div>
</main>

<button class="fab" id="fab" data-act="open-add" data-tab="food" aria-label="Log food or exercise">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Log
</button>

<nav class="tabbar" aria-label="Sections"><div class="in">
  <button class="tab" data-act="tab" data-v="today" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Today</button>
  <button class="tab" data-act="tab" data-v="trends">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Trends</button>
  <button class="tab" data-act="tab" data-v="goals">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8" fill="currentColor"/></svg>Goals</button>
</div></nav>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-act="close"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-label="Log an entry">
    <div class="panel-h" id="sheet-h"></div>
    <div class="panel-b" id="sheet-b"></div>
  </div>
</div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
"use strict";
/* =====================================================================
   Fuel & Move — web client
   Talks to the REST API in /server. All data lives in PostgreSQL;
   the browser keeps only the login token.
   ===================================================================== */

const API = "/api";
const TOKEN_KEY = "fuel-move.token";
// The app's name follows the phone's language: Chinese systems see 薄肌理论指南.
const LANG = String((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en";
const APP_NAME = LANG === "zh" ? "薄肌理论指南" : "Lean Muscle Theory Guide";
document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
document.title = APP_NAME;
document.querySelectorAll(".app-name").forEach(el => { el.textContent = APP_NAME; });
document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute("content", APP_NAME);
const MEALS = [["breakfast","Breakfast"],["lunch","Lunch"],["dinner","Dinner"],["snack","Snacks"]];
const ACTIVITY = [[1.2,"Mostly sitting","Desk job, little exercise"],[1.375,"Lightly active","Exercise 1–3 days/week"],[1.55,"Active","Exercise 3–5 days/week"],[1.725,"Very active","Hard training 6–7 days/week"]];
const GOALS = [["lose1","Lose 1 lb / week",-500],["lose05","Lose ½ lb / week",-250],["maintain","Maintain",0],["gain05","Gain ½ lb / week",250]];
const PRELOAD_DAYS = 90;

/* ---------- state ---------- */
const S = {
  user: null,
  profile: null,        // server profile (kg / cm)
  days: {},             // "YYYY-MM-DD" -> {food:[], ex:[], water, weight}
  fetched: new Set(),   // dates whose data is loaded
  lib: {recent:[], custom:[], library:[]},
  acts: [],
  summary: null,
};
let view = "today", cur = keyOf(new Date()), authMode = "login";

/* ---------- small helpers ---------- */
function keyOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function shift(k,n){const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)}
const today = () => keyOf(new Date());
const emptyDay = () => ({food:[],ex:[],water:0,weight:null});
const dayFor = k => S.days[k] || emptyDay();
const mutDay = k => S.days[k] || (S.days[k] = emptyDay());
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(n).toLocaleString("en-US");
const r1 = n => Math.round(n*10)/10;
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
const $ = id => document.getElementById(id);
const store = {
  get(){try{return localStorage.getItem(TOKEN_KEY)}catch(e){return null}},
  set(v){try{v?localStorage.setItem(TOKEN_KEY,v):localStorage.removeItem(TOKEN_KEY)}catch(e){}}
};

/* ---------- API client ---------- */
let pending = 0;
async function api(method, path, body){
  const token = store.get();
  pending++; setSync();
  try{
    const res = await fetch(API+path, {
      method,
      headers: {...(body!==undefined?{"Content-Type":"application/json"}:{}), ...(token?{Authorization:"Bearer "+token}:{})},
      body: body!==undefined ? JSON.stringify(body) : undefined,
    });
    if (res.status===204) { S.syncError=false; return null; }
    const data = await res.json().catch(()=>null);
    if (res.status===401 && !path.startsWith("/auth/")) { signOut("Your session expired. Sign in again."); throw new Error("unauthorized"); }
    if (!res.ok) { const e=new Error(data?.error?.message || "Request failed"); e.code=data?.error?.code; e.status=res.status; throw e; }
    S.syncError=false;
    return data;
  } catch(e){
    if (e instanceof TypeError) { S.syncError=true; const err=new Error("Can't reach the server. Check your connection and try again."); err.code="offline"; throw err; }
    throw e;
  } finally { pending--; setSync(); }
}
function setSync(){
  const el=$("sync"); if(!el) return;
  el.className = "sync " + (S.syncError ? "error" : pending ? "saving" : "on");
  el.title = S.syncError ? "Not saved" : pending ? "Saving…" : "Synced";
  el.querySelector("span").textContent = S.syncError ? "Not saved" : pending ? "Saving…" : "Synced";
}
function fail(e){ if(e && e.message!=="unauthorized") toast(e.message || "Something went wrong"); }

/* ---------- mapping server ⇄ client ---------- */
const fromFood = f => ({id:f.id,n:f.name,s:f.serving,k:f.kcal,p:f.protein,c:f.carbs,f:f.fat,q:f.quantity,meal:f.meal,foodId:f.foodId,customFoodId:f.customFoodId,source:f.source});
const fromEx = e => ({id:e.id,n:e.name,min:e.minutes,k:e.kcal,note:e.note||"",activityId:e.activityId,met:e.met,source:e.source});
const srcTag = src => src==="ai" ? `<span class="tag ai">AI</span>` : src==="quick" ? `<span class="tag">Quick</span>` : "";
const fromDay = d => ({food:d.food.map(fromFood),ex:d.exercise.map(fromEx),water:d.waterGlasses,weight:d.weightKg});
function putDays(days, from, to){
  for (let k=from; k<=to; k=shift(k,1)) { S.fetched.add(k); if(!S.days[k]) S.days[k]=emptyDay(); }
  for (const d of days) S.days[d.date] = fromDay(d);
}

/* ---------- units & targets ---------- */
const wu = () => S.profile.weightUnit;                       // "lb" | "kg" | "jin"
const isImperial = () => S.profile.heightUnit === "ftin";
const W_FACTOR = {kg:1, lb:1/0.45359237, jin:2};
const kgToDisp = kg => r1(kg*W_FACTOR[wu()]);
const dispToKg = v => v/W_FACTOR[wu()];
const wUnit = () => ({kg:"kg",lb:"lb",jin:"斤"})[wu()];
const GLASS_ML = 250;                                      // one tap = 250 ml
const glassLabel = () => GLASS_ML + " ml";
const toLiters = glasses => (glasses * GLASS_ML / 1000).toFixed(2).replace(/\.?0+$/, "");  // 6 → "1.5"
const burnFor = (met,min) => Math.round(met*3.5*S.profile.weightKg/200*min);
function targets(){
  // Same formula as server/src/lib/nutrition.ts, for instant feedback while editing.
  const p=S.profile;
  const bmr=10*p.weightKg+6.25*p.heightCm-5*p.age+(p.sex==="male"?5:-161);
  const tdee=bmr*p.activity;
  const adj=(GOALS.find(g=>g[0]===p.goal)||GOALS[2])[2];
  const auto=Math.max(p.sex==="male"?1500:1200, Math.round((tdee+adj)/10)*10);
  const kcal=p.calorieOverride||auto;
  const protein=Math.round(p.proteinPerKg*p.weightKg), fat=Math.round(kcal*0.28/9);
  return {tdee,auto,kcal,protein,fat,carbs:Math.max(0,Math.round((kcal-protein*4-fat*9)/4)),water:p.waterGoal};
}
function totals(d){
  let k=0,p=0,c=0,f=0;
  for (const it of d.food){k+=it.k*it.q;p+=it.p*it.q;c+=it.c*it.q;f+=it.f*it.q}
  return {k,p,c,f,burn:d.ex.reduce((a,e)=>a+e.k,0),min:d.ex.reduce((a,e)=>a+e.min,0)};
}

/* ---------- toast ---------- */
let toastTimer, undoFn=null;
function toast(msg, undo){
  const t=$("toast"); undoFn=undo||null;
  t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">Undo</button>':""}`;
  t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{t.hidden=true;undoFn=null},4500);
}

/* ---------- icons ---------- */
const I = {
  l:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  r:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* =====================================================================
   Sign in
   ===================================================================== */
function showAuth(message){
  $("loading").hidden=true; $("app").hidden=true; $("auth").hidden=false;
  setAuthMode(authMode);
  if (message) { $("auth-err").textContent=message; $("auth-err").hidden=false; }
}
function setAuthMode(m){
  authMode=m; const reg=m==="register";
  $("auth-title").textContent = reg ? "Create your account" : "Track what you eat and how you move";
  $("auth-name-f").hidden=!reg; $("a-pass-hint").hidden=!reg;
  $("a-pass").autocomplete = reg ? "new-password" : "current-password";
  $("auth-submit").textContent = reg ? "Create account" : "Sign in";
  $("auth-switch-q").textContent = reg ? "Have an account?" : "New here?";
  $("auth-switch").textContent = reg ? "Sign in" : "Create an account";
  $("auth-err").hidden=true;
}
async function submitAuth(){
  const email=$("a-email").value.trim(), password=$("a-pass").value, name=$("a-name").value.trim();
  const err=$("auth-err"), btn=$("auth-submit");
  if (!email || !password) { err.textContent="Enter your email and password."; err.hidden=false; return; }
  if (authMode==="register" && password.length<8) { err.textContent="Use a password with at least 8 characters."; err.hidden=false; return; }
  btn.disabled=true; err.hidden=true;
  try{
    const r = await api("POST", authMode==="register"?"/auth/register":"/auth/login", authMode==="register"?{email,password,...(name?{name}:{})}:{email,password});
    store.set(r.token); $("a-pass").value="";
    await boot();
  }catch(e){ err.textContent=e.message; err.hidden=false; }
  finally{ btn.disabled=false; }
}
function signOut(message){
  store.set(null);
  Object.assign(S,{user:null,profile:null,days:{},fetched:new Set(),summary:null});
  closeSheet(); showAuth(message);
}

/* =====================================================================
   Boot: load everything the first screens need in parallel
   ===================================================================== */
async function boot(){
  if (!store.get()) return showAuth();
  $("auth").hidden=true; $("loading").hidden=false;
  const to=today(), from=shift(to,-(PRELOAD_DAYS-1));
  try{
    const [me, range, lib, acts] = await Promise.all([
      api("GET","/me"), api("GET",`/days?from=${from}&to=${to}`), api("GET","/foods?limit=100"), api("GET","/activities"),
    ]);
    S.user=me.user; S.profile=me.profile; S.lib=lib; S.acts=acts.activities;
    putDays(range.days, from, to);
  }catch(e){
    if (e.message==="unauthorized") return;
    $("loading").textContent = e.message + " ";
    const retry=document.createElement("button"); retry.className="linkbtn"; retry.textContent="Try again"; retry.dataset.act="retry";
    $("loading").appendChild(retry);
    return;
  }
  $("loading").hidden=true; $("app").hidden=false;
  cur=today(); show("today");
}
async function ensureDay(k){
  if (S.fetched.has(k)) return;
  try{ const d=await api("GET","/days/"+k); S.days[k]=fromDay(d); S.fetched.add(k); }
  catch(e){ fail(e); }
}
function refreshLibrary(){ api("GET","/foods?limit=100").then(l=>{S.lib=l}).catch(()=>{}); }

/* =====================================================================
   Today
   ===================================================================== */
function dateTitle(k){
  const t=today();
  if (k===t) return "Today";
  if (k===shift(t,-1)) return "Yesterday";
  return parseKey(k).toLocaleDateString("en-US",{weekday:"long"});
}
function unitToggle(){
  return `<div class="minis" role="group" aria-label="Weight unit">${[["lb","lb"],["kg","kg"],["jin","斤"]].map(([v,l])=>`<button data-act="wunit" data-v="${v}" aria-pressed="${wu()===v}">${l}</button>`).join("")}</div>`;
}
function renderToday(){
  const el=$("view-today");
  if (!S.fetched.has(cur)) { el.innerHTML = dateNav() + `<div class="loading">Loading ${esc(dateTitle(cur))}…</div>`; ensureDay(cur).then(()=>{ if(view==="today") renderToday(); }); return; }
  const d=dayFor(cur), t=targets(), tot=totals(d);
  const net=tot.k-tot.burn, left=t.kcal-net, over=left<0;
  const C=2*Math.PI*56, pct=clamp(net/t.kcal,0,1);
  const mac=(name,v,g,color)=>`<div class="macro"><div class="name">${name}</div><div class="val">${fmt(v)}<small> / ${fmt(g)} g</small></div><div class="bar"><span style="width:${clamp(v/g*100,0,100)}%;background:var(${color})"></span></div></div>`;
  const banner = !S.profile.setupComplete ? `<div class="banner"><span>Targets below use a default profile. Add your age, height and weight for personal numbers.</span><button class="btn" data-act="tab" data-v="goals">Set goals</button></div>` : "";
  const mealsHtml = MEALS.map(([m,label])=>{
    const items=d.food.filter(f=>f.meal===m);
    const sum=items.reduce((a,f)=>a+f.k*f.q,0);
    const list = items.length ? `<ul class="items">${items.map(f=>`<li class="item"><div class="txt"><div class="n">${esc(f.n)}</div><div class="s">${srcTag(f.source)}${esc(qtyText(f))} · P ${fmt(f.p*f.q)} · C ${fmt(f.c*f.q)} · F ${fmt(f.f*f.q)}</div></div><div class="k">${fmt(f.k*f.q)}</div><button class="del" data-act="del-food" data-id="${f.id}" aria-label="Remove ${esc(f.n)}">${I.x}</button></li>`).join("")}</ul>` : `<div class="empty">Nothing logged yet.</div>`;
    return `<div class="card"><div class="sec-h"><h2>${label}</h2><span class="tot">${items.length?fmt(sum)+" kcal":""}</span></div>${list}<div class="addrow"><button class="chip" data-act="open-add" data-tab="food" data-meal="${m}">+ Add food</button>${items.length?"":quickChips(m)}</div></div>`;
  }).join("");
  const exHtml = d.ex.length ? `<ul class="items">${d.ex.map(e=>`<li class="item"><div class="txt"><div class="n">${esc(e.n)}</div><div class="s">${srcTag(e.source)}${e.min?fmt(e.min)+" min":"Calories only"}${e.note?" · "+esc(e.note):""}</div></div><div class="k burn">−${fmt(e.k)}</div><button class="del" data-act="del-ex" data-id="${e.id}" aria-label="Remove ${esc(e.n)}">${I.x}</button></li>`).join("")}</ul>` : `<div class="empty">No workouts logged. Calories burned are estimated from the activity, minutes and your weight.</div>`;
  const nGlass=Math.max(t.water,d.water);
  const glasses=Array.from({length:nGlass},(_,i)=>`<button class="glass${i<d.water?" full":""}" data-act="water" data-i="${i}" aria-label="${i+1} glass${i?"es":""}"><span>${i+1}</span></button>`).join("");
  const w=d.weight;
  el.innerHTML = `${dateNav()}${banner}
  <div class="card">
    <div class="summary">
      <div class="ring${over?" over":""}">
        <svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="56" fill="none" stroke="var(--sunk)" stroke-width="11"/><circle cx="66" cy="66" r="56" fill="none" stroke="${over?"var(--danger)":"var(--accent)"}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg>
        <div class="center"><div class="big">${fmt(Math.abs(left))}</div><div class="lbl">${over?"kcal over":"kcal left"}</div></div>
      </div>
      <dl class="eq">
        <dt>Daily goal</dt><dd>${fmt(t.kcal)}</dd>
        <dt>Food</dt><dd>− ${fmt(tot.k)}</dd>
        <dt>Exercise</dt><dd class="burn">+ ${fmt(tot.burn)}</dd>
        <div class="sep"></div>
        <dt>${over?"Over":"Remaining"}</dt><dd>${fmt(Math.abs(left))}</dd>
      </dl>
    </div>
    <div class="macros">${mac("Protein",tot.p,t.protein,"--prot")}${mac("Carbs",tot.c,t.carbs,"--carb")}${mac("Fat",tot.f,t.fat,"--fat")}</div>
  </div>
  ${mealsHtml}
  <div class="card"><div class="sec-h"><h2>Exercise</h2><span class="tot">${d.ex.length?(tot.min?fmt(tot.min)+" min · ":"")+fmt(tot.burn)+" kcal":""}</span></div>${exHtml}<div class="addrow"><button class="chip" data-act="open-add" data-tab="ex">+ Add exercise</button></div></div>
  <div class="card"><div class="sec-h"><h2>Water</h2><span class="tot">${toLiters(d.water)} / ${toLiters(t.water)} L</span></div><div class="glasses">${glasses}</div><p class="hint" style="margin-top:8px">One glass is ${glassLabel()}. Tap a glass to fill up to it.</p></div>
  <div class="card"><div class="sec-h"><h2>Weight</h2>${unitToggle()}</div>
    ${w?`<p class="muted" style="margin:0 0 10px">Logged <strong class="num" style="font-size:20px;color:var(--ink)">${kgToDisp(w)} ${wUnit()}</strong></p>`:""}
    <form class="wrow" data-form="weight"><div class="unit" style="flex:1;min-width:120px"><input id="w-in" type="number" inputmode="decimal" step="0.1" min="20" max="900" placeholder="${w?kgToDisp(w):"Today's weight"}" aria-label="Weight in ${wUnit()}"><em>${wUnit()}</em></div><button class="btn" type="submit">${w?"Update":"Log weight"}</button></form>
  </div>`;
}
function dateNav(){
  return `<div class="datenav">
    <button class="iconbtn" data-act="prev" aria-label="Previous day">${I.l}</button>
    <div style="text-align:center;min-width:0"><h1>${dateTitle(cur)}</h1><p>${parseKey(cur).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}${cur!==today()?` · <button class="linkbtn" data-act="go-today">Back to today</button>`:""}</p></div>
    <button class="iconbtn" data-act="next" aria-label="Next day" ${cur>=today()?"disabled":""}>${I.r}</button>
  </div>`;
}
function qtyText(f){const q=f.q;return (q===1?"":(q%1?q.toFixed(1):q)+" × ")+(f.s||"1 serving")}
function recentFoods(){ return S.lib.recent.map(r=>({n:r.name,s:r.serving,k:r.kcal,p:r.protein,c:r.carbs,f:r.fat,meal:r.meal,foodId:r.foodId,customFoodId:r.customFoodId})); }
function quickChips(meal){
  return recentFoods().filter(f=>f.meal===meal).slice(0,2).map(f=>`<button class="chip solid" data-act="quick" data-name="${esc(f.n)}" data-meal="${meal}">${esc(f.n)}</button>`).join("");
}

/* =====================================================================
   Trends (from GET /api/summary)
   ===================================================================== */
async function renderTrends(){
  const el=$("view-trends");
  if (!S.summary) el.innerHTML=`<div class="datenav"><div><h1>Last 7 days</h1></div></div><div class="loading">Loading trends…</div>`;
  try{ S.summary = await api("GET",`/summary?to=${today()}&days=7`); }
  catch(e){ fail(e); if(!S.summary) return; }
  if (view!=="trends") return;
  const s=S.summary, t=s.targets;
  const range=`${parseKey(s.from).toLocaleDateString("en-US",{month:"short",day:"numeric"})} – ${parseKey(s.to).toLocaleDateString("en-US",{month:"short",day:"numeric"})}`;
  const v=(x,unit)=>x==null?"—":`${fmt(x)}<small> ${unit}</small>`;
  el.innerHTML = `
  <div class="datenav"><div><h1>Last 7 days</h1><p>${range}</p></div></div>
  <div class="card"><div class="sec-h"><h2>Calories</h2><span class="tot">goal ${fmt(t.kcal)}</span></div>${weekChart(s.days,t)}
    <div class="legend"><span><i style="background:var(--accent)"></i>Eaten</span><span><i style="background:var(--burn)"></i>Burned</span><span><i style="background:transparent;border:1.5px dashed var(--muted)"></i>Daily goal</span></div></div>
  <div class="stats">
    <div class="stat"><div class="v">${v(s.averages.kcal,"kcal")}</div><div class="l">Avg eaten on ${s.loggedDays} logged day${s.loggedDays===1?"":"s"}</div></div>
    <div class="stat"><div class="v">${v(s.averages.protein,"g")}</div><div class="l">Avg protein (goal ${t.protein} g)</div></div>
    <div class="stat"><div class="v">${s.totals.workouts}</div><div class="l">Workouts · ${fmt(s.totals.activeMinutes)} active min</div></div>
    <div class="stat"><div class="v">${((s.averages.waterGlasses??0)*GLASS_ML/1000).toFixed(1)}<small> / ${toLiters(t.water)} L</small></div><div class="l">Avg water per day</div></div>
    <div class="stat"><div class="v">${s.streak}<small> day${s.streak===1?"":"s"}</small></div><div class="l">Logging streak</div></div>
    <div class="stat"><div class="v">${fmt(s.totals.burned)}<small> kcal</small></div><div class="l">Burned from exercise</div></div>
  </div>
  <div class="card"><div class="sec-h"><h2>Weight</h2><span class="tot">${weightSummary(s.weight)}</span></div>${weightChart(s.weight.series)}</div>`;
}
function weekChart(days,t){
  const W=340,H=180,L=38,R=6,T=10,B=26, ih=H-T-B, iw=W-L-R;
  const maxV=Math.max(t.kcal,...days.map(d=>Math.max(d.kcal,d.burned)),1);
  const step=maxV>2600?1000:500, top=Math.ceil(maxV*1.08/step)*step;
  const y=v=>T+ih*(1-v/top), slot=iw/days.length, bw=Math.min(18,slot*0.34);
  let g="";
  for(let v=0;v<=top;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v>=1000?(v/1000)+"k":v}</text>`}
  days.forEach((d,i)=>{
    const cx=L+slot*i+slot/2, isT=d.date===today();
    if(d.kcal>0) g+=`<rect x="${cx-bw-1}" y="${y(d.kcal)}" width="${bw}" height="${Math.max(0,y(0)-y(d.kcal))}" rx="3" fill="var(--accent)"><title>${fmt(d.kcal)} kcal eaten</title></rect>`;
    if(d.burned>0) g+=`<rect x="${cx+1}" y="${y(d.burned)}" width="${bw}" height="${Math.max(0,y(0)-y(d.burned))}" rx="3" fill="var(--burn)"><title>${fmt(d.burned)} kcal burned</title></rect>`;
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" font-weight="${isT?700:400}" fill="${isT?"var(--ink)":"var(--muted)"}">${parseKey(d.date).toLocaleDateString("en-US",{weekday:"short"}).slice(0,2)}</text>`;
  });
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(t.kcal)}" y2="${y(t.kcal)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories eaten and burned over the last 7 days">${g}</svg>`;
}
function weightSummary(w){
  if (w.series.length<2) return w.series.length ? `${kgToDisp(w.series[0].weightKg)} ${wUnit()}` : "";
  const ch=kgToDisp(w.series[w.series.length-1].weightKg)-kgToDisp(w.series[0].weightKg);
  return `${ch>0?"+":""}${r1(ch)} ${wUnit()} over ${w.series.length} weigh-ins`;
}
function weightChart(p){
  if(p.length<2) return `<div class="empty">Log your weight on the Today screen. A trend line appears after two weigh-ins.</div>`;
  const W=340,H=150,L=40,R=10,T=12,B=24;
  const ws=p.map(x=>kgToDisp(x.weightKg)); let mn=Math.min(...ws), mx=Math.max(...ws);
  if(mx-mn<2){const m=(mx+mn)/2;mn=m-1;mx=m+1}
  const pad=(mx-mn)*0.12; mn-=pad; mx+=pad;
  const x=i=>L+(W-L-R)*(i/(p.length-1)), y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const line=ws.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area=line+`L${x(ws.length-1)},${H-B}L${x(0)},${H-B}Z`;
  let g=[mn+pad,(mn+mx)/2,mx-pad].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${r1(v)}</text>`).join("");
  const f=d=>parseKey(d).toLocaleDateString("en-US",{month:"short",day:"numeric"});
  g+=`<path d="${area}" fill="var(--accent)" opacity=".12"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
  g+=`<circle cx="${x(ws.length-1)}" cy="${y(ws[ws.length-1])}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  g+=`<text x="${L}" y="${H-6}" font-size="10.5" fill="var(--muted)">${f(p[0].date)}</text><text x="${W-R}" y="${H-6}" text-anchor="end" font-size="10.5" fill="var(--muted)">${f(p[p.length-1].date)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">${g}</svg>`;
}

// Profile edits are applied locally right away and sent to the server
// as one PATCH after the user pauses typing.
let profPatch={}, profTimer=null;
function patchProfile(fields, delay=600){
  Object.assign(S.profile, fields); Object.assign(profPatch, fields, {setupComplete:true}); S.profile.setupComplete=true;
  S.summary=null;
  clearTimeout(profTimer); profTimer=setTimeout(flushProfile, delay);
}
async function flushProfile(){
  const body=profPatch; profPatch={};
  if (!Object.keys(body).length) return;
  try{ const r=await api("PATCH","/profile",body); S.profile={...r.profile, ...profPatch}; }
  catch(e){ fail(e); }
}
function onProfileInput(inp){
  const p=S.profile, k=inp.dataset.k, v=parseFloat(inp.value);
  if (k==="goal") patchProfile({goal:inp.value});
  else if (k==="calorieOverride") patchProfile({calorieOverride: v>=800&&v<=6000 ? Math.round(v) : null});
  else if (!isFinite(v)) return;
  else if (k==="age") { if(v>=13&&v<=100) patchProfile({age:Math.round(v)}); }
  else if (k==="ft"||k==="in"){ const cm=((+$("g-ft").value||0)*12+(+$("g-in").value||0))*2.54; if(cm>100&&cm<260) patchProfile({heightCm:r1(cm)}); }
  else if (k==="cm"){ if(v>100&&v<260) patchProfile({heightCm:v}); }
  else if (k==="wt"){ const kg=dispToKg(v); if(kg>25&&kg<400) patchProfile({weightKg:Math.round(kg*100)/100}); }
  else if (k==="activity"||k==="proteinPerKg") patchProfile({[k]:v});
  else if (k==="waterGoal") patchProfile({waterGoal:clamp(Math.round(v*1000/GLASS_ML),1,20)});
  renderTargets();
}
function setWeightUnit(v){ patchProfile({weightUnit:v, heightUnit: v==="lb"?"ftin":"cm"}, 0); }

  try{ await navigator.clipboard.writeText(sh.ai.prompt); toast("Prompt copied. Paste it into your AI app with a photo."); return; }catch(e){}
  t.removeAttribute("readonly"); t.focus(); t.select(); t.setSelectionRange(0, t.value.length);
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  t.setAttribute("readonly","");
  toast(ok ? "Prompt copied. Paste it into your AI app with a photo." : "Select the prompt and copy it.");
}
async function readAiReply(){
  const text=($("ai-reply")?.value||"").trim();
  sh.ai.text=text;
  if (!text) { sh.ai.error="Paste your AI's reply first."; return renderSheet(); }
  if (sh.busy) return; sh.busy=true;
  try{
    const r=await api("POST","/ai/parse-food",{text});
    Object.assign(sh.ai,{step:"review",items:r.items,notes:r.notes,error:null});
  }catch(e){ sh.ai.error=e.message; }
  finally{ sh.busy=false; }
  renderSheet();
}
async function saveAiItems(){
  const items=sh.ai.items.filter(i=>i.name.trim() && +i.kcal>=0);
  if (!items.length || sh.busy) return; sh.busy=true;
  const date=cur, meal=sh.meal;
  try{
    const r=await api("POST",`/days/${date}/food/batch`,{meal, source:"ai", items:items.map(i=>({name:i.name.trim(),serving:i.serving,kcal:+i.kcal||0,protein:+i.protein||0,carbs:+i.carbs||0,fat:+i.fat||0}))});
    const d=mutDay(date); r.entries.forEach(en=>d.food.push(fromFood(en))); S.summary=null;
    closeSheet(); renderToday(); refreshLibrary();
    toast(`Added ${r.entries.length} item${r.entries.length===1?"":"s"} (${fmt(r.entries.reduce((s,e)=>s+e.kcal*e.quantity,0))} kcal) to ${MEALS.find(x=>x[0]===meal)[1]}`);
  }catch(e){ fail(e); }
  finally{ sh.busy=false; }
}

  <form class="form" data-form="cfood">
    <div class="field"><label for="cf-n">Food name</label><input id="cf-n" type="text" required maxlength="120" value="${esc(sh.q)}" placeholder="e.g. Mom's lasagna"></div>
    <div class="grid2"><div class="field"><label for="cf-s">Serving</label><input id="cf-s" type="text" maxlength="60" placeholder="1 plate"></div>
    <div class="field"><label for="cf-k">Calories</label><div class="unit"><input id="cf-k" type="number" inputmode="numeric" min="0" max="5000" required placeholder="0"><em>kcal</em></div></div></div>
    <div class="grid3"><div class="field"><label for="cf-p">Protein</label><div class="unit"><input id="cf-p" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0"><em>g</em></div></div>
    <div class="field"><label for="cf-c">Carbs</label><div class="unit"><input id="cf-c" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0"><em>g</em></div></div>
    <div class="field"><label for="cf-f">Fat</label><div class="unit"><input id="cf-f" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0"><em>g</em></div></div></div>
    ${mealSeg()}
    <button class="btn block" type="submit">Add food</button>
    <p class="hint">Custom foods are saved to your account and show up in search next time.</p>

function exDetail(){
  const a=sh.pick, k=sh.kcal ?? burnFor(a.m,sh.min);
  return `<button class="linkbtn" data-act="back" style="align-self:flex-start">‹ Back to activities</button>
  <div class="detail"><h3>${esc(a.n)}</h3><p class="muted" style="margin:2px 0 0">MET ${a.m} · estimate uses ${kgToDisp(S.profile.weightKg)} ${wUnit()} body weight</p></div>
  <form class="form" data-form="ex">
    <div class="grid2"><div class="field"><label for="ex-min">Duration</label><div class="unit"><input id="ex-min" type="number" inputmode="numeric" min="1" max="600" value="${sh.min}" required><em>min</em></div></div>
    <div class="field"><label for="ex-k">Calories burned</label><div class="unit"><input id="ex-k" type="number" inputmode="numeric" min="0" max="5000" value="${k}"><em>kcal</em></div></div></div>
    <div class="field"><label for="ex-note">Notes</label><input id="ex-note" type="text" maxlength="200" placeholder="${/Strength/.test(a.n)?"e.g. Squat 3×8, bench 3×10":"e.g. 3.1 mi, felt strong"}"></div>
    <button class="btn block" type="submit">Add exercise</button>
    <p class="hint">Calories update as you change the duration. Type your watch's number to override.</p>
  </form>`;
}
function customExForm(){
  return `<button class="linkbtn" data-act="back" style="align-self:flex-start">‹ Back to activities</button>
  <form class="form" data-form="cex">
    <div class="field"><label for="ce-n">Activity</label><input id="ce-n" type="text" required maxlength="120" value="${esc(sh.q)}" placeholder="e.g. Rock climbing"></div>
    <div class="grid2"><div class="field"><label for="ce-min">Duration</label><div class="unit"><input id="ce-min" type="number" inputmode="numeric" min="1" max="600" required placeholder="30"><em>min</em></div></div>
    <div class="field"><label for="ce-k">Calories burned</label><div class="unit"><input id="ce-k" type="number" inputmode="numeric" min="0" max="5000" required placeholder="0"><em>kcal</em></div></div></div>
    <div class="field"><label for="ce-note">Notes</label><input id="ce-note" type="text" maxlength="200" placeholder="Optional"></div>
    <button class="btn block" type="submit">Add exercise</button>
  </form>`;
}

/* =====================================================================
   Writes
   ===================================================================== */
function foodBody(f, meal, quantity){
  if (f.foodId) return {meal, foodId:f.foodId, quantity};
  if (f.customFoodId) return {meal, customFoodId:f.customFoodId, quantity};
  return {meal, quantity, name:f.n, serving:f.s||"1 serving", kcal:+f.k||0, protein:+f.p||0, carbs:+f.c||0, fat:+f.f||0, ...(f.save?{saveAsCustom:true}:{}), ...(f.source&&f.source!=="library"&&f.source!=="custom"?{source:f.source}:{})};
}
async function addFood(f, quantity){
  if (sh.busy) return; sh.busy=true;
  const date=cur, meal=sh.meal;
  try{
    const entry=await api("POST",`/days/${date}/food`, foodBody(f, meal, quantity));
    mutDay(date).food.push(fromFood(entry)); S.summary=null;
    closeSheet(); renderToday(); refreshLibrary();
    toast(`Added ${entry.name} to ${MEALS.find(x=>x[0]===meal)[1]}`);
  }catch(e){ fail(e); }
  finally{ sh.busy=false; }
}
async function addEx(body, label){
  if (sh.busy) return; sh.busy=true;
  const date=cur;
  try{
    const entry=await api("POST",`/days/${date}/exercise`, body);
    mutDay(date).ex.push(fromEx(entry)); S.summary=null;
    closeSheet(); renderToday();
    toast(`Logged ${entry.name}, ${fmt(entry.kcal)} kcal`);
  }catch(e){ fail(e); }
  finally{ sh.busy=false; }
}
async function removeItem(kind,id){
  const date=cur, d=mutDay(date), arr=kind==="food"?d.food:d.ex, i=arr.findIndex(x=>x.id===id);
  if (i<0) return;
  const [it]=arr.splice(i,1); renderToday();
  try{ await api("DELETE",`/${kind==="food"?"food":"exercise"}/${id}`); S.summary=null; }
  catch(e){ arr.splice(i,0,it); renderToday(); return fail(e); }
  toast(`Removed ${it.n}`, async()=>{
    try{
      if (kind==="food"){ const e=await api("POST",`/days/${date}/food`, foodBody(it,it.meal,it.q)); mutDay(date).food.splice(i,0,fromFood(e)); }
      else { const e=await api("POST",`/days/${date}/exercise`, {name:it.n,minutes:it.min,kcal:it.k,...(it.activityId?{activityId:it.activityId}:{}),...(it.note?{note:it.note}:{})}); mutDay(date).ex.splice(i,0,fromEx(e)); }
      if (view==="today") renderToday();
    }catch(e){ fail(e); }
  });
}
// Water taps are coalesced into one request per pause.
const waterTimers={};
function setWater(date, glasses){
  mutDay(date).water=glasses; S.summary=null; renderToday();
  clearTimeout(waterTimers[date]);
  waterTimers[date]=setTimeout(()=>api("PUT",`/days/${date}/water`,{glasses:mutDay(date).water}).catch(fail), 400);
}
async function logWeight(v){
  const kg=dispToKg(v);
  if(!(kg>25&&kg<400)) return toast(`Enter a weight in ${wUnit()}, like ${wu()==="lb"?"165.4":wu()==="jin"?"136.0":"75.0"}.`);
  const date=cur;
  try{
    const r=await api("PUT",`/days/${date}/weight`,{weightKg:Math.round(kg*100)/100});
    mutDay(date).weight=r.weightKg; if(r.profileWeightKg!=null) S.profile.weightKg=r.profileWeightKg; S.summary=null;
    renderToday(); toast(`Logged ${r1(v)} ${wUnit()}`);
  }catch(e){ fail(e); }
}

/* =====================================================================
   Views & events
   ===================================================================== */
function show(v){
  view=v;
  for (const id of ["today","trends","goals"]) $("view-"+id).hidden = id!==v;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current", t.dataset.v===v?"page":"false"));
  $("fab").hidden = v!=="today";
  if (v==="today") renderToday(); else if (v==="trends") renderTrends(); else renderGoals();
  window.scrollTo(0,0);
}

document.addEventListener("click", e => {
  const a=e.target.closest("[data-act]"); if(!a) return;
  switch(a.dataset.act){
    case "auth-mode": setAuthMode(authMode==="login"?"register":"login"); break;
    case "retry": $("loading").textContent="Loading your log…"; boot(); break;
    case "signout": flushProfile().finally(()=>signOut()); break;
    case "tab": show(a.dataset.v); break;
    case "prev": cur=shift(cur,-1); renderToday(); break;
    case "next": if(cur<today()){cur=shift(cur,1); renderToday();} break;
    case "go-today": cur=today(); renderToday(); break;
    case "open-add": openSheet(a.dataset.tab||"food", a.dataset.meal); break;
    case "quick": { const f=recentFoods().find(x=>x.n===a.dataset.name); if(f) openSheet("food",a.dataset.meal,f); break; }
    case "close": closeSheet(); break;
    case "stab": Object.assign(sh,{tab:a.dataset.v,pick:null,custom:false,mode:null,q:"",kcal:null}); renderSheet(); break;
    case "pick": Object.assign(sh,{pick:sh.list[+a.dataset.i],qty:1,kcal:null,min:30}); renderSheet(); break;
    case "back": sh.pick=null; sh.custom=false; sh.mode=null; renderSheet(); break;
    case "mode": {
      sh.mode=a.dataset.v;
      if (sh.mode==="ai") { sh.ai={step:"prompt",prompt:"",text:"",items:[],notes:null,error:null}; loadAiPrompt(); }
      renderSheet();
      const first=$(sh.mode==="quick"?(sh.tab==="food"?"qf-k":"qe-k"):"x"); if(first) first.focus();
      break;
    }
    case "ai-copy": copyPrompt(); break;
    case "ai-read": readAiReply(); break;
    case "ai-back": sh.ai.step="prompt"; renderSheet(); break;
    case "ai-del": sh.ai.items.splice(+a.dataset.i,1); renderSheet(); break;
    case "ai-save": saveAiItems(); break;
    case "custom": sh.custom=true; renderSheet(); break;
    case "qty": sh.qty=clamp(sh.qty+parseFloat(a.dataset.d),0.5,20); renderSheet(); break;
    case "meal": {
      sh.meal=a.dataset.v; a.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===a));
      const add=document.querySelector('[data-act="add-food"]'); if(add) add.textContent="Add to "+MEALS.find(x=>x[0]===sh.meal)[1];
      if (sh.mode==="ai") { if (sh.ai.step==="prompt") { sh.ai.text=$("ai-reply")?.value||""; sh.ai.prompt=""; renderSheet(); loadAiPrompt(); } else renderSheet(); }
      break;
    }
    case "add-food": addFood(sh.pick, sh.qty); break;
    case "water": { const d=dayFor(cur), i=+a.dataset.i; setWater(cur, d.water===i+1 ? i : i+1); break; }
    case "del-food": removeItem("food",a.dataset.id); break;
    case "del-ex": removeItem("ex",a.dataset.id); break;
    case "undo": if(undoFn){const f=undoFn; undoFn=null; $("toast").hidden=true; f();} break;
    case "wunit": setWeightUnit(a.dataset.v); renderToday(); break;
    case "prof": {
      const k=a.dataset.k, v=a.dataset.v;
      if (k==="units") setWeightUnit(v); else patchProfile({[k]:v}, 300);
      renderGoals(); break;
    }
  }
});
document.addEventListener("input", e => {
  const t=e.target;
  if (t.id==="s-q"){ sh.q=t.value; renderResults(); return; }
  if (t.dataset.aiK && sh.ai){
    const it=sh.ai.items[+t.dataset.aiI]; if(!it) return;
    it[t.dataset.aiK] = t.dataset.aiK==="kcal" ? (parseFloat(t.value)||0) : t.value;
    const tot=$("ai-total"); if(tot) tot.textContent=fmt(sh.ai.items.reduce((s,i)=>s+(+i.kcal||0),0))+" kcal";
    return;
  }
  if (t.id==="ai-reply" && sh.ai){ sh.ai.text=t.value; return; }
  if (t.id==="ex-min"){ const m=parseFloat(t.value); if(m>0){ sh.min=m; sh.kcal=null; const k=$("ex-k"); if(k) k.value=burnFor(sh.pick.m,m);} return; }
  if (t.id==="ex-k"){ const v=parseFloat(t.value); sh.kcal=isFinite(v)?v:null; return; }
  if (t.closest('[data-form="profile"]') && t.dataset.k && t.tagName!=="SELECT") onProfileInput(t);
});
document.addEventListener("change", e => { const t=e.target; if (t.tagName==="SELECT" && t.closest('[data-form="profile"]')) onProfileInput(t); });
document.addEventListener("submit", e => {
  const f=e.target, form=f.dataset.form; if(!form) return;
  e.preventDefault();
  const val=id=>$(id).value.trim(), num=id=>parseFloat(val(id))||0;
  if (form==="auth") submitAuth();
  else if (form==="profile") flushProfile();
  else if (form==="weight") logWeight(parseFloat(val("w-in")));
  else if (form==="cfood"){
    const n=val("cf-n"); if(!n) return toast("Give the food a name.");
    addFood({n,s:val("cf-s")||"1 serving",k:num("cf-k"),p:num("cf-p"),c:num("cf-c"),f:num("cf-f"),save:true}, 1);
  } else if (form==="ex"){
    const m=Math.round(num("ex-min")); if(!(m>0)) return toast("Enter how many minutes you exercised.");
    const kv=parseFloat(val("ex-k")), note=val("ex-note");
    addEx({activityId:sh.pick.id, minutes:m, ...(sh.kcal!=null&&isFinite(kv)?{kcal:kv}:{}), ...(note?{note}:{})});
  } else if (form==="qfood"){
    const k=parseFloat(val("qf-k")); if(!(k>=0)) return toast("Enter the calories you ate.");
    addFood({n:val("qf-n")||"Quick add",s:"1 serving",k,p:num("qf-p"),c:num("qf-c"),f:num("qf-f"),source:"quick"}, 1);
  } else if (form==="qex"){
    const k=parseFloat(val("qe-k")); if(!(k>=0)) return toast("Enter the calories you burned.");
    const m=Math.round(num("qe-min"));
    addEx({name:val("qe-n")||"Exercise", kcal:k, source:"quick", ...(m>0?{minutes:m}:{})});
  } else if (form==="cex"){
    const n=val("ce-n"), m=Math.round(num("ce-min")); if(!n||!(m>0)) return toast("Enter the activity and how many minutes.");
    const note=val("ce-note");
    addEx({name:n, minutes:m, kcal:num("ce-k"), ...(note?{note}:{})});
  }
});
document.addEventListener("keydown", e => { if(e.key==="Escape" && !$("sheet").hidden) closeSheet(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState==="hidden") flushProfile();
  else if (S.profile && view==="today") renderToday();
});

boot();
})();
</script>
